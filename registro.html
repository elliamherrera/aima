<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro · AIMA</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div class="risk">Contenido educativo, no es asesoría financiera. Invertir en criptomonedas tiene alto riesgo de pérdida. Rendimientos pasados no garantizan resultados futuros.</div>
<main><h1>Registro</h1>
<form id="f"><label>Nombre<input id="n" required></label><label>Correo<input id="e" type="email" required></label>
<label><input type="checkbox" required style="display:inline;width:auto"> Leí y acepto el <a href="aviso-de-riesgo.html" style="color:#4A80BF">aviso de riesgo</a>.</label><br>
<button class="btn" style="border:0;cursor:pointer;background:#FFE600;padding:12px 24px;font-weight:900">Crear mi ID</button></form>
<h2 id="r"></h2></main>
<footer><a href="index.html">Inicio</a> · <a href="aviso-de-riesgo.html">Aviso de riesgo</a></footer>
<script>
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();
var id='AIMA-'+crypto.randomUUID().replace(/-/g,'').slice(0,8).toUpperCase();
var u=JSON.parse(localStorage.getItem('aima_users')||'[]');
u.push({id:id,nombre:n.value,correo:e.value,fecha:new Date().toISOString()});
localStorage.setItem('aima_users',JSON.stringify(u));
document.getElementById('r').textContent='¡Listo, '+n.value+'! Tu ID es '+id;this.reset();};
</script></body></html>
